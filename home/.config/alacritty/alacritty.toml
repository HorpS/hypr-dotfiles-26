[window]
padding = { x = 8, y = 8 }
decorations = "Full"
opacity = 0.4

[font]
size = 11.0

[cursor]
style = { shape = "Block", blinking = "On" }

[selection]
save_to_clipboard = true

[scrolling]
history = 10000

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"
