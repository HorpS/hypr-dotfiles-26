# Laptop idle policy.  Video players and other applications may inhibit these
# timers while they are actively in use.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Protect the session before powering down its display.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Save panel/backlight power after seven minutes; restore on input.
listener {
    timeout = 420
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Suspend after thirty minutes of genuine inactivity.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
